<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="StuTool · 高二数学与化学家教记录">
  <title>StuTool · 家教工作台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="container">
      <div class="brand">
        <a href="index.html">
          <span class="brand-icon"><i class="fas fa-book-open"></i></span>
          <span>StuTool</span>
        </a>
      </div>
      <ul class="nav-menu">
        <li><a href="index.html" class="active"><i class="fas fa-house"></i><span>首页</span></a></li>
        <li><a href="math.html"><i class="fas fa-square-root-variable"></i><span>数学</span></a></li>
        <li><a href="chem.html"><i class="fas fa-flask"></i><span>化学</span></a></li>
      </ul>
    </div>
  </header>

  <section class="home-hero">
    <span class="welcome"><i class="fas fa-graduation-cap"></i> 高二数学 · 化学 · 家教记录</span>
    <h1>StuTool</h1>
    <p>每次课的教案、课堂记录与课后总结，都整理在这里</p>
  </section>

  <main class="container">
    <div class="entry-grid">

      <a class="entry-card math" href="math.html">
        <div class="entry-icon"><i class="fas fa-square-root-variable"></i></div>
        <h2>数学</h2>
        <p class="entry-desc">高二数学 · 函数、导数、数列、解析几何……</p>
        <div class="entry-footer">
          <div class="entry-stats">
            <div><span class="num" data-stat="math-count">1</span><span class="lbl">节课</span></div>
          </div>
          <div class="entry-arrow"><i class="fas fa-arrow-right"></i></div>
        </div>
      </a>

      <a class="entry-card chem" href="chem.html">
        <div class="entry-icon"><i class="fas fa-flask"></i></div>
        <h2>化学</h2>
        <p class="entry-desc">高二化学 · 反应原理、有机化学……</p>
        <div class="entry-footer">
          <div class="entry-stats">
            <div><span class="num" data-stat="chem-count">1</span><span class="lbl">节课</span></div>
          </div>
          <div class="entry-arrow"><i class="fas fa-arrow-right"></i></div>
        </div>
      </a>

    </div>
  </main>

  <footer>
    <p>StuTool · 高二数学与化学家教记录</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
